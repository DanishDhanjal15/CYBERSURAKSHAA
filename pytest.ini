[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The intel layer is stdlib-only by design, so the suite runs without model
# weights, without a GPU, and without a populated database. Anything that does
# need those is marked and skipped by default rather than failing loudly on a
# clean checkout.
markers =
    slow: needs model weights or network access
    integration: exercises the full Flask app

filterwarnings =
    ignore::DeprecationWarning:audioop
    ignore::DeprecationWarning:pytest_asyncio.*

addopts = -ra --strict-markers
